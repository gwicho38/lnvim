name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Plugin Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.10.2, v0.11.2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Install lazy.nvim
        run: |
          mkdir -p ~/.local/share/nvim/lazy
          git clone --filter=blob:none https://github.com/folke/lazy.nvim.git \
            --branch=stable ~/.local/share/nvim/lazy/lazy.nvim

      - name: Bootstrap Config
        run: |
          mkdir -p ~/.config
          ln -s $GITHUB_WORKSPACE ~/.config/nvim

      - name: Install Plugins
        run: |
          nvim --headless "+Lazy! sync" +qa 2>&1 | tee install_log.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Plugin installation failed"
            cat install_log.txt
            exit 1
          fi

      - name: Run Startup Test
        run: |
          nvim --headless \
            -c "lua vim.print('Config loaded successfully')" \
            -c "qa"

      - name: Check Plugin Loading
        run: |
          nvim --headless \
            -c "lua local plugins = require('lazy').plugins(); print('Loaded ' .. #plugins .. ' plugins')" \
            -c "qa" 2>&1 | grep -q "Loaded"

      - name: Verify LSP Config
        run: |
          nvim --headless \
            -c "lua local ok = pcall(require, 'lspconfig'); print('LSP: ' .. tostring(ok))" \
            -c "qa" 2>&1 | grep -q "LSP: true"

      - name: Run Plenary Tests
        run: |
          nvim --headless \
            -c "PlenaryBustedDirectory tests/ { minimal_init = 'init.lua' }" 2>&1 | tee test_output.txt
          if grep -q "FAIL" test_output.txt; then
            echo "Tests failed!"
            cat test_output.txt
            exit 1
          fi
          echo "All tests passed"

      - name: Test Claude Code Integration
        run: |
          nvim --headless \
            -c "lua local ok = pcall(require, 'claude-code'); print('Claude Code: ' .. tostring(ok))" \
            -c "qa" 2>&1 | grep -q "Claude Code: true"
